name: Request an app icon
description: Suggest a Mac app for the DockFold picker.
title: "[App request] "
labels: [app-request]
body:
  - type: markdown
    attributes:
      value: |
        Search existing app requests first. If yours is already there, add a 👍 reaction to its first post to vote, or attach an icon in a comment.
        Requests and attachments are public. Please use the app name in the issue title.
  - type: input
    id: app-name
    attributes:
      label: App name
      placeholder: Name of the Mac app
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official app website
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: icon
    attributes:
      label: App icon (optional)
      description: Drag a square PNG here, ideally 512 × 512 or larger with transparency. Include where the icon came from. Instructions at https://dockfold.vercel.app/#/contribute.
  - type: textarea
    id: why
    attributes:
      label: Anything else?
      description: Your use case, a preferred icon variant, or other helpful context.
