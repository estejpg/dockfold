name: Suggest a Dock
description: Share a considered macOS setup for the DockFold collection.
title: "[Dock submission] "
labels: [dock-submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your setup. Submissions are public and reviewed before they appear in the collection. Please only include details you are comfortable sharing.
  - type: input
    id: dock-name
    attributes:
      label: Dock name
    validations:
      required: true
  - type: input
    id: dock-link
    attributes:
      label: DockFold share link
      description: Create the full link at https://dockfold.vercel.app/submit. Keep the part after the # symbol.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is this Dock for?
      description: Tell us what makes these apps work well together.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: Name or website to use if you would like public credit.
