name: Check DockFold
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path macos/DockfoldCapture
      - run: swift test --package-path macos/DockfoldCapture
